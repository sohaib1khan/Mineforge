name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-test:
    name: Backend (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run backend tests
        run: |
          docker compose -f deploy/docker-compose.test.yml build backend-test
          docker compose -f deploy/docker-compose.test.yml run --rm --no-deps backend-test

  frontend-test:
    name: Frontend (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend test stage
        run: docker build -f Dockerfile --target frontend-test -t mineforge-frontend-test:ci .

  image:
    name: Runtime image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f Dockerfile --target runtime -t mineforge:ci .
