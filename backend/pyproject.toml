[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineforge"
version = "0.9.0"
description = "MineForge — Bedrock dedicated server control panel"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "sqlmodel>=0.0.22",
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "slowapi>=0.1.9",
  "structlog>=24.4.0",
  "docker>=7.1.0",
  "zstandard>=0.23.0",
  "apscheduler>=3.10.4",
  "httpx>=0.28.0",
  "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "black>=24.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["help_guides/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI File()/Form()/Depends() in defaults is intentional
# E501: black owns wrapping; long strings/URLs stay readable
ignore = ["B008", "E501"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--cov=app/services",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["app/services"]
omit = [
  "*/__init__.py",
  # Orchestration / Docker / log stream covered by integration tests
  # (see docs/release-checklist.md):
  "*/addons.py",
  "*/backups.py",
  "*/switch.py",
  "*/worlds.py",
  "*/docker_client.py",
  "*/operations.py",
  "*/logwatch.py",
  "*/console.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
