# MineForge — Docker-first deploy.
#   ./deploy/mf up              # app + socket-proxy
#   ./deploy/mf up bedrock      # also start Bedrock dedicated server
#   ./deploy/mf test

name: mineforge

services:
  # tecnativa 0.3.0 writes generated haproxy.cfg next to the template under
  # /usr/local/etc/haproxy — that path cannot be tmpfs'd (hides the template)
  # and cannot be read_only. Trust boundary = env ACL + internal network only.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
      POST: 1
      LOGS: 1
      STATS: 1
      EVENTS: 1
      PING: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
      ALLOW_RESTARTS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      # Avoid HAProxy bind failures on hosts without working IPv6.
      DISABLE_IPV6: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mineforge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  mineforge:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    image: mineforge:local
    ports:
      - "${MINEFORGE_HOST_PORT:-18080}:8080"
    env_file:
      - .env
    environment:
      MINEFORGE_APP_DATA_DIR: /app-data
      MINEFORGE_DATA_DIR: /data
      MINEFORGE_STATIC_DIR: /app/static
      MINEFORGE_DOCKER_HOST: tcp://socket-proxy:2375
      MINEFORGE_BEDROCK_CONTAINER: ${MINEFORGE_BEDROCK_CONTAINER:-bedrock}
      MINEFORGE_BEDROCK_UID: ${BEDROCK_UID:-1000}
      MINEFORGE_BEDROCK_GID: ${BEDROCK_GID:-1000}
      # Match Bedrock file ownership so allowlist/server.properties writes work.
      MINEFORGE_RUNTIME_UID: ${MINEFORGE_RUNTIME_UID:-1000}
      MINEFORGE_RUNTIME_GID: ${MINEFORGE_RUNTIME_GID:-1000}
    volumes:
      - mineforge-data:/app-data
      # Host path (bind) when attaching an existing server, else named volume.
      # Example: BEDROCK_DATA_HOST_PATH=/home/mcvm/minecraft/data
      - ${BEDROCK_DATA_HOST_PATH:-bedrock-data}:/data
    depends_on:
      - socket-proxy
      - mediamtx
    restart: unless-stopped
    networks:
      - mineforge
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    # Entrypoint needs these to chown /app-data and drop to the runtime UID.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    security_opt:
      - no-new-privileges:true

  # OBS publishes RTMP on the LAN only. HLS (:8888) and API (:9997) stay
  # on the internal Docker network — MineForge proxies HLS for viewers.
  mediamtx:
    image: bluenviron/mediamtx:1.12.2
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file:
      - .env
    environment:
      MINEFORGE_INTERNAL_STREAM_SECRET: ${MINEFORGE_INTERNAL_STREAM_SECRET:-CHANGE_ME_INTERNAL_STREAM_SECRET}
      MEDIAMTX_TEMPLATE: /mediamtx.yml.template
      MEDIAMTX_CONFIG_OUT: /tmp/mediamtx.yml
    volumes:
      - ./mediamtx/entrypoint.sh:/entrypoint.sh:ro
      - ./mediamtx/mediamtx.yml.template:/mediamtx.yml.template:ro
    ports:
      # Bind to LAN IP from .env — never publish 0.0.0.0 on a public host.
      - "${MEDIAMTX_RTMP_BIND_IP:-127.0.0.1}:1935:1935"
    networks:
      - mineforge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  bedrock:
    profiles: ["bedrock"]
    image: itzg/minecraft-bedrock-server:${BEDROCK_IMAGE_TAG:-latest}
    container_name: ${MINEFORGE_BEDROCK_CONTAINER:-bedrock}
    environment:
      EULA: "TRUE"
      VERSION: ${BEDROCK_VERSION:-LATEST}
      UID: ${BEDROCK_UID:-1000}
      GID: ${BEDROCK_GID:-1000}
      TZ: ${TZ:-UTC}
      TRANSPORT: nethernet
      SERVER_PORT: "19132"
      SERVER_UDP_PORTS: ${SERVER_UDP_PORTS:-'<public_ip>:19140-19155:19140-19155'}
      # Intentionally NOT setting LEVEL_NAME / GAMEMODE / DIFFICULTY —
      # MineForge owns those keys in server.properties.
    volumes:
      - ${BEDROCK_DATA_HOST_PATH:-bedrock-data}:/data
    ports:
      - "19132:19132/tcp"
      - "19140-19155:19140-19155/udp"
    networks:
      - mineforge
    restart: unless-stopped

volumes:
  mineforge-data:
  bedrock-data:

networks:
  mineforge:
    name: mineforge
