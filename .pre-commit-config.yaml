repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        files: ^backend/

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.[jt]sx?$
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: frontend/node_modules/.bin/prettier --write
        language: system
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, json, css, markdown, yaml, html]
